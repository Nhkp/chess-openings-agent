[project]
name = "projet-13"
version = "0.1.0"
description = "POC local d'agent IA pour l'entrainement aux ouvertures d'echecs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.0",
    "google-api-python-client>=2.198.0",
    "langgraph>=1.2.8",
    "pymilvus>=3.0.0",
    "pymongo>=4.17.0",
    "python-chess>=1.999",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "coverage>=7.15.0",
    "milvus-lite>=3.0",
]

[tool.coverage.run]
source = ["backend/app", "backend/scripts"]

[tool.coverage.report]
fail_under = 80
show_missing = true
