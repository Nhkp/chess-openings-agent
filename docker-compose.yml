services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - api
  api:
    build: .
    environment:
      API_PORT: ${API_PORT:-8000}
      LICHESS_EXPLORER_URL: ${LICHESS_EXPLORER_URL:-https://explorer.lichess.ovh/lichess}
      LICHESS_TOKEN: ${LICHESS_TOKEN:-}
      LICHESS_TIMEOUT_SECONDS: ${LICHESS_TIMEOUT_SECONDS:-5}
      STOCKFISH_PATH: ${STOCKFISH_PATH:-/usr/games/stockfish}
      STOCKFISH_DEPTH: ${STOCKFISH_DEPTH:-12}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-opening_notes}
      VECTOR_SEARCH_LIMIT: ${VECTOR_SEARCH_LIMIT:-3}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-semantic-lite-multilingual-hash}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-opening_agent}
      MONGODB_EVENTS_COLLECTION: ${MONGODB_EVENTS_COLLECTION:-agent_events}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_MAX_RESULTS: ${YOUTUBE_MAX_RESULTS:-5}
      YOUTUBE_RELEVANCE_LANGUAGE: ${YOUTUBE_RELEVANCE_LANGUAGE:-fr}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      seed-openings:
        condition: service_completed_successfully
      mongodb:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthcheck', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  seed-openings:
    build: .
    command: ["python", "-m", "backend.scripts.load_openings"]
    environment:
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-opening_notes}
      VECTOR_SEARCH_LIMIT: ${VECTOR_SEARCH_LIMIT:-3}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-semantic-lite-multilingual-hash}
    depends_on:
      - milvus
    restart: "no"
  mongodb:
    image: mongo:8.0
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    volumes:
      - minio-data:/minio_data
  milvus:
    image: milvusdb/milvus:v2.6.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "${MILVUS_PORT:-19530}:19530"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio

volumes:
  mongodb-data:
  etcd-data:
  minio-data:
  milvus-data:
